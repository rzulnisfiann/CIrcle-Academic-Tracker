  <style>
:root{--ink:#252343;--muted:#696780;--purple:#6452c8;--line:#e9e6f5;--wash:#f6f4fd}
*{box-sizing:border-box}body{font-family:"DM Sans",sans-serif;color:var(--ink);margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:wait;opacity:.55}:focus-visible{outline:3px solid #7567df;outline-offset:3px}
.shell{min-height:calc(100 * min(var(--vh, 1vh), 1vh));width:100%;background:radial-gradient(circle at 85% 4%,#e9e4ff 0,transparent 37%),#f6f4fd}
.panel{background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:0 12px 38px #46359a0b}.btn{border:0;border-radius:13px;padding:11px 17px;font-weight:700;transition:transform .18s,box-shadow .18s}.btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 20px #594bc124}.primary{background:#6452c8;color:white}.soft{background:#efecfc;color:#5140a8}.danger{background:#fff0f1;color:#b63854}
.field{width:100%;border:1px solid #dcd8ec;border-radius:12px;padding:11px 13px;background:#fff;color:var(--ink)}.field:focus{outline:2px solid #a69aef;border-color:transparent}.label{display:block;font-weight:700;margin-bottom:7px;font-size:14px}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:700;background:#eeebff;color:#5140a8}.chip.ok{background:#e6f7ed;color:#167447}.chip.warn{background:#fff1db;color:#a45a11}.chip.late{background:#ffeaee;color:#b13350}
.navbtn{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border:0;border-radius:13px;text-align:left;color:#66637e;font-weight:700;background:transparent}.navbtn:hover,.navbtn.active{background:#efecfc;color:#5140a8}.navbtn svg{width:19px;height:19px;flex:none}
.view{animation:appear .25s ease both}@keyframes appear{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.bottom{display:none}.overlay{position:fixed;inset:0;background:#24204483;z-index:40;display:grid;place-items:center;padding:20px}.toast{position:fixed;right:18px;bottom:22px;z-index:60;max-width:380px;padding:14px 18px;border-radius:14px;background:#292346;color:white;box-shadow:0 14px 40px #211a4d44}.toast.error{background:#9e3150}.progress{height:9px;background:#ece8fb;border-radius:100px;overflow:hidden}.progress>div{height:100%;background:linear-gradient(90deg,#8d7ae5,#5846c5);border-radius:100px}
.file-row{border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:8px;overflow-wrap:anywhere}.file-row img{width:80px;height:64px;object-fit:cover;border-radius:8px}
@media(max-width:900px){.sidebar{display:none}.bottom{display:flex;position:sticky;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--line);overflow-x:auto;padding:7px 4px}.bottom .navbtn{flex:none;width:70px;flex-direction:column;gap:3px;padding:7px 3px;text-align:center;font-size:10px;justify-content:center}.bottom .navbtn svg{width:20px;height:20px}}
@media(max-width:620px){.appmain{padding:18px 16px 32px!important}.appheader{padding:18px 16px!important}.panel{border-radius:18px}.desktop-title{font-size:24px!important}}
</style>

     </nav>

      Satu lingkaran, satu langkah maju.
     </div>
    </aside>
    <div class="flex-1 min-w-0 flex flex-col">
     <header data-template-id="app-header" class="canva-header appheader bg-white border-b border-[#e9e6f5] px-9 py-5 flex items-center justify-between gap-3" style="background: rgb(255, 255, 255);">

    <div>
      <p data-template-id="header-kicker" class="canva-text font-bold uppercase tracking-widest" style="color: rgb(100, 82, 200); font-weight: 700; font-style: normal; font-size: 11px;">CIRCLE ACADEMIC TRACKER</p>
      <p id="header-view" class="font-extrabold text-lg"></p>

      <div class="flex items-center gap-2 flex-wrap justify-end">

     </nav>

  <script>
(() => {
"use strict";
const members=[{id:"fian",name:"Fian"},{id:"ifnu",name:"Ifnu"},{id:"faizi",name:"Faizi"},{id:"mahesa",name:"Mahesa"},{id:"ghifari",name:"Ghifari"}];
// Isi dengan Project URL dan publishable key dari Supabase. Jangan gunakan service_role/secret key di browser.
const SUPABASE_URL="https://teaxqgcdwcmdhlqbrenz.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_pR8eAO7lqGSF8d4wMIn-mA_X2NMzk_D";
const VAPID_PUBLIC_KEY = "BFUkogo9XWxWJr9bbPEjRC5PhA71JMVQ6fW_0OVhrLR2AEjIiVnVI2aklHBBYZjXyk48qcJ9htH10k0b8woMw4o";
// Bucket harus private dan nama harus persis sama dengan Supabase Storage.
const STORAGE_BUCKET="Circle Academic Tracker";
const supabaseConfigured=SUPABASE_URL.startsWith("https://")&&!SUPABASE_PUBLISHABLE_KEY.startsWith("PASTE_");
const supabaseClient=supabaseConfigured?window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY):null;
const legacyCourses=["Bioinformatika","Biokimia","Statistika","Sains Data","Biofisika","Data Mining","Teknologi Sekuensing","Sistem Biologi","Biostatistika","Teknologi Omics","Pengantar Simulasi Molekuler"].map((name,i)=>({id:"course-"+(i+1),name}));
const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const validTime=v=>!v||/^([01]\d|2[0-3]):[0-5]\d$/.test(v);
const dateNumber=s=>{if(!/^\d{4}-\d{2}-\d{2}$/.test(s||""))return NaN;const [y,m,d]=s.split("-").map(Number);const dt=new Date(Date.UTC(y,m-1,d));return dt.getUTCFullYear()===y&&dt.getUTCMonth()===m-1&&dt.getUTCDate()===d?dt.getTime()/86400000:NaN};
const dateText=s=>Number.isFinite(dateNumber(s))?new Intl.DateTimeFormat("id-ID",{day:"numeric",month:"long",year:"numeric",timeZone:"UTC"}).format(new Date(s+"T12:00:00Z")):"Tanpa tanggal";
const dateTimeText=(date,time)=>date?dateText(date)+" · "+(validTime(time)&&time?time:"Jam belum ditentukan"):"Tanpa tanggal";
const sortDateTime=(a,b,dateKey,timeKey)=>{const da=Number.isFinite(dateNumber(a[dateKey]))?dateNumber(a[dateKey]):Infinity,db=Number.isFinite(dateNumber(b[dateKey]))?dateNumber(b[dateKey]):Infinity;return da-db||((validTime(a[timeKey])&&a[timeKey])?a[timeKey]:"99:99").localeCompare((validTime(b[timeKey])&&b[timeKey])?b[timeKey]:"99:99")||String(a.title||a.agenda_description||"").localeCompare(String(b.title||b.agenda_description||""),"id")};
const sortTasks=(a,b)=>sortDateTime(a,b,"deadline","deadline_time");
const sortAgenda=(a,b)=>sortDateTime(a,b,"agenda_date","agenda_time");
const safeUrl=v=>{try{const u=new URL(v);return ["https:","http:"].includes(u.protocol)?u.href:null}catch{return null}};
const norm=v=>String(v||"").trim().replace(/\s+/g," ").toLocaleLowerCase("id-ID");
const today=()=>new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Jakarta",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());
const icons=()=>window.lucide&&lucide.createIcons();
let records=[],ready=false,member=null,view="dashboard",selectedCourse=null,taskFilter="all",agendaTab="active",nearestScope="mine",nearestCourse="all",nearestType="all",editingTask=null,editingAgenda=null,editingCourse=null,loadTimer,toastTimer,callbackVersion=0;
let fileDraft=[],fileSession=new Map();
const pending=new Map();let chain=Promise.resolve(),lastWrite=0;
function notify(text,error=false){clearTimeout(toastTimer);$("toast-root").innerHTML=`<div class="toast ${error?"error":""}" role="status">${esc(text)}</div>`;toastTimer=setTimeout(()=>$("toast-root").replaceChildren(),5500)}
function iconButton(label,attr,value,cls="soft"){return `<button type="button" class="btn ${cls} text-sm" ${attr}="${esc(value)}">${label}</button>`}
function empty(title,detail,action="",target=""){return `<div class="panel p-8 text-center"><div class="mx-auto mb-4 w-12 h-12 bg-[#f0edff] text-[#6452c8] rounded-2xl grid place-items-center"><i data-lucide="inbox"></i></div><h3 class="font-extrabold text-lg">${esc(title)}</h3><p class="text-[#696780] mt-2">${esc(detail)}</p>${action?iconButton(esc(action),"data-go",target):""}</div>`}
function template(){return {record_type:"",task_id:"",course_id:"",title:"",description:"",link:"",task_type:"",deadline:"",deadline_time:"",submission_place:"",attachment_meta:"",created_by:"",created_at:"",updated_at:"",member_id:"",status:"",group_status:"",agenda_number:0,agenda_description:"",agenda_date:"",agenda_time:"",agenda_status:"",assigned_members:""}}
function overlayRecords(){return records.map(r=>pending.has(r.__backendId)?{...r,...pending.get(r.__backendId)}:r)}
const tasks=()=>overlayRecords().filter(r=>r.record_type==="task");
const agendas=()=>overlayRecords().filter(r=>r.record_type==="agenda");
function courses(){
 const saved=records.filter(r=>r.record_type==="course");
 const deleted=new Set(saved.filter(r=>r.status==="deleted").map(r=>r.course_id));
 const current=new Map(saved.filter(r=>r.status!=="deleted"&&r.title).map(r=>[r.course_id,{id:r.course_id,name:String(r.title).trim()}]));
 // Legacy data may predate persisted course rows. Tombstones hide deleted defaults.
 for(const c of legacyCourses)if(!deleted.has(c.id)&&!current.has(c.id)&&records.some(r=>r.record_type==="task"&&r.course_id===c.id))current.set(c.id,c);
 return [...current.values()];
}
const courseName=id=>courses().find(c=>c.id===id)?.name||"Mata kuliah tidak diketahui";
const memberName=id=>members.find(m=>m.id===id)?.name||id;
function assignees(t){try{const a=JSON.parse(t.assigned_members||"[]");return Array.isArray(a)?a.filter(x=>members.some(m=>m.id===x)):[]}catch{return []}}
function statuses(t){try{const s=JSON.parse(t.status||"{}");return s&&typeof s==="object"?s:{}}catch{return {}}}
const memberDone=(t,id)=>t.task_type==="Kelompok"?t.group_status==="Done":statuses(t)[id]==="Done";
const done=t=>assignees(t).length>0&&(t.task_type==="Kelompok"?t.group_status==="Done":assignees(t).every(id=>memberDone(t,id)));
function loginChoices(){
  $("login-loading").textContent=supabaseConfigured?"Semangatt Menugas!.":"Isi Project URL dan publishable key Supabase pada konfigurasi file terlebih dahulu.";
  $("login-retry").classList.toggle("hidden",!supabaseConfigured);icons();
}
async function login(id){member=id;view="dashboard";$("login").classList.add("hidden");$("application").classList.remove("hidden");render()}
async function logout(){try{if(supabaseClient)await supabaseClient.auth.signOut()}catch(e){console.error(e)}member=null;editingTask=null;editingAgenda=null;clearDraft();$("application").classList.add("hidden");$("login").classList.remove("hidden");loginChoices()}
async function signIn(e){
 e.preventDefault();const button=$("auth-submit"),email=$("auth-email").value.trim(),password=$("auth-password").value;
 if(!supabaseConfigured){notify("Lengkapi Project URL dan publishable key di konfigurasi file terlebih dahulu.",true);return}
 button.disabled=true;button.textContent="Memeriksa akun…";$("login-loading").textContent="Mengautentikasi akun…";
 try{
  const {data,error}=await supabaseClient.auth.signInWithPassword({email,password});if(error)throw error;
  const {data:profile,error:profileError}=await supabaseClient.from("circle_members").select("member_id,role").eq("user_id",data.user.id).single();
  if(profileError||!profile?.member_id||!members.some(m=>m.id===profile.member_id)){await supabaseClient.auth.signOut();throw new Error("Akun berhasil dikenali, tetapi member_id belum dipasangkan di circle_members.")}
  await login(profile.member_id);const initResult=await window.dataSdk.init(handler);if(!initResult.isOk)throw new Error("Data kelompok gagal dimuat.");
 }catch(err){console.error(err);$("login-loading").textContent=err.message||"Login gagal. Periksa email, password, dan pengaturan Supabase.";notify($("login-loading").textContent,true)}
 finally{button.disabled=false;button.textContent="Masuk"}
}
function navigate(next){if(view==="task-form"&&next!=="task-form")clearDraft();view=next;if(next!=="task-form")editingTask=null;if(next!=="agenda")editingAgenda=null;render();window.scrollTo({top:0,behavior:"smooth"})}
function render(){if(!member)return;if(selectedCourse&&!courses().some(c=>c.id===selectedCourse))selectedCourse=null;
 $("active-member").textContent=memberName(member);
 $("header-view").textContent=({dashboard:"Dashboard","task-form":editingTask?"Edit Tugas":"Input Tugas",courses:selectedCourse?courseName(selectedCourse):"Tugas per Mata Kuliah",agenda:"Agenda Grup",nearest:"Tugas Terdekat",guide:"Cara Pakai"})[view];
 document.querySelectorAll("[data-view]").forEach(b=>b.classList.toggle("active",b.dataset.view===view));
 $("content").innerHTML=({dashboard, "task-form":taskForm,courses:courseView,agenda:agendaView,nearest:nearestView,guide:guideView})[view]();icons();hydrateAttachmentPreviews();
 if(view==="task-form"){renderFiles();const type=$("task-type");if(type)$("initial-status-wrap").classList.toggle("hidden",type.value!=="Kelompok")}
}
function dashboard(){
 const all=tasks(),finished=all.filter(done).length,mine=all.filter(t=>assignees(t).includes(member)&&!memberDone(t,member)).length,pct=all.length?Math.round(finished/all.length*100):0;
 const active=agendas().filter(a=>a.agenda_status!=="Sudah Terlaksana"&&a.agenda_date>=today()).sort(sortAgenda).slice(0,4);
 const next=all.filter(t=>!done(t)&&t.deadline&&dateNumber(t.deadline)>=dateNumber(today())).sort(sortTasks).slice(0,3);
 const cards=[["Total Tugas",all.length,"layers-3"],["Tugas Saya Belum Selesai",mine,"clock-3"],["Tugas Selesai Semua",finished,"circle-check"],["Tugas Belum Selesai Semua",all.length-finished,"circle-dashed"]];
 return `<div class="view"><div class="flex flex-wrap items-end justify-between gap-4 mb-7"><div><p class="text-[#6452c8] font-bold mb-1">RUANG KERJA KELOMPOK</p><h1 class="desktop-title text-3xl font-extrabold">Halo, ${esc(memberName(member))}! 👋</h1><p class="text-[#696780] mt-2">Siap menyelesaikan tugas hari ini?</p></div><div class="flex gap-2">${iconButton("+ Tambah tugas","data-go","task-form","primary")}${iconButton("+ Agenda","data-go","agenda")}</div></div>

function meta(t){try{const x=JSON.parse(t?.attachment_meta||"[]");return Array.isArray(x)?x.filter(f=>f&&typeof f.id==="string"):[]}catch{return []}}
function bytes(n){return n>=1048576?(n/1048576).toFixed(1)+" MB":Math.max(1,Math.ceil(n/1024))+" KB"}
async function createAttachmentUrl(storagePath){
 if(!storagePath)throw new Error("Path lampiran tidak tersedia.");
 const {data,error}=await supabaseClient.storage.from(STORAGE_BUCKET).createSignedUrl(storagePath,300);
 if(error||!data?.signedUrl)throw error||new Error("URL lampiran tidak berhasil dibuat.");
 return data.signedUrl;
}
async function openStoredAttachment(taskId,fileId,popup){
 try{
  const task=records.find(t=>t.record_type==="task"&&t.task_id===taskId);
  const f=meta(task).find(x=>x.id===fileId);
  if(!f?.storagePath)throw new Error("File ini adalah lampiran lama yang belum memiliki storagePath. File perlu diunggah ulang.");
  popup.location.href=await createAttachmentUrl(f.storagePath);
 }catch(error){if(popup&&!popup.closed)popup.close();notify(error.message||"Lampiran tidak dapat dibuka. Periksa izin Storage dan koneksi.",true)}
}
async function hydrateAttachmentPreviews(){
 for(const img of document.querySelectorAll("img[data-storage-preview-task][data-storage-preview-file]")){
  if(img.dataset.loaded==="true")continue;
  img.dataset.loaded="true";
  const task=records.find(t=>t.record_type==="task"&&t.task_id===img.dataset.storagePreviewTask);
  const f=meta(task).find(x=>x.id===img.dataset.storagePreviewFile);
  if(!f?.storagePath){img.hidden=true;continue}
  try{img.src=await createAttachmentUrl(f.storagePath)}catch{img.hidden=true}
 }
}
function attachmentView(t,editing=false){

  const live=fileSession.get(taskId)?.get(f.id)||f.url||null;
  const openLink=live?`<a href="${esc(live)}" target="_blank" rel="noopener noreferrer" class="text-[#5140a8] underline font-bold">Buka file ↗</a>`:f.storagePath?`<a href="#" data-open-attachment="${esc(taskId)}" data-file-id="${esc(f.id)}" class="text-[#5140a8] underline font-bold">Buka file ↗</a>`:'<p class="text-sm text-[#a45a11]">Lampiran lama belum tersimpan di Storage atau tidak memiliki storagePath.</p>';

 }).join(""):"<p class='text-sm text-[#696780] mt-2'>Belum ada lampiran.</p>";

function setPending(button,on){if(!button)return;button.disabled=on;button.setAttribute("aria-busy",String(on))}
const capacity=()=>{if(records.length>=999){notify("Batas 999 catatan tercapai.",true);return false}if(records.length>=950)notify(`Penyimpanan mendekati batas: ${records.length}/999 catatan.`);return true};
function waitFor(predicate,start){if(callbackVersion>start&&predicate(records))return Promise.resolve(true);return new Promise(resolve=>{let timer;const poll=setInterval(()=>{if(callbackVersion>start&&predicate(records)){clearInterval(poll);clearTimeout(timer);resolve(true)}},70);timer=setTimeout(()=>{clearInterval(poll);resolve(false)},4500)})}

async function mutate(kind, record, control, predicate) {
  if (control?.disabled) return false;

  setPending(control, true);

  try {
    const start = callbackVersion;
    const result = await window.dataSdk[kind](record);

    if (!result.isOk) {
      throw new Error(result.error || "Penyimpanan belum terkonfirmasi.");
    }

    // Beri kesempatan sinkronisasi memperbarui daftar lokal.
    // Jika terlambat, jangan langsung menganggap penyimpanan gagal.
    const synced = await waitFor(predicate, start);

    if (!synced) {
      console.warn(
        "Data tersimpan di Supabase, tetapi daftar lokal belum terkonfirmasi."
      );
    }

    return true;
  } catch (error) {
    console.error("Penyimpanan gagal:", error);
    notify(
      error.message || "Penyimpanan gagal. Periksa koneksi dan coba lagi.",
      true
    );
    return false;
  } finally {
    setPending(control, false);
  }
}

// Supabase adapter: shared records in public.circle_records; requires authenticated group membership.
function fromDb(row){
 const r={...row,__backendId:row.id};
 r.attachment_meta=JSON.stringify(row.attachment_meta??[]);
 r.assigned_members=JSON.stringify(row.assigned_members??[]);
 r.status=typeof row.status==="string"?row.status:JSON.stringify(row.status??{});
 return r;
}
function toDb(record) {
  const r = { ...record };

  delete r.__backendId;
  delete r.id;

  // JSONB: ubah string JSON menjadi array atau objek.
  for (const k of ["attachment_meta", "assigned_members"]) {
    if (typeof r[k] === "string") {
      try {
        r[k] = JSON.parse(r[k]);
      } catch {
        r[k] = [];
      }
    }
  }

  // Status disimpan sebagai JSONB jika kolom Supabase memang JSONB.
  if (typeof r.status === "string" && r.status.startsWith("{")) {
    try {
      r.status = JSON.parse(r.status);
    } catch {
      // Biarkan status aslinya jika bukan JSON yang valid.
    }
  }

  // Nilai kosong untuk tanggal dan jam harus menjadi null.
  for (const k of [
    "deadline",
    "agenda_date",
    "deadline_time",
    "agenda_time"
  ]) {
    if (r[k] === "") r[k] = null;
  }

  // Kolom nomor agenda yang opsional.
  if (r.agenda_number === "" || r.agenda_number === undefined) {
    r.agenda_number = null;
  }

  // Buang properti undefined.
  for (const k of Object.keys(r)) {
    if (r[k] === undefined) delete r[k];
  }

  return r;
}

async create(record) {
  try {
    const payload = toDb(record);

    // Tunggu konfirmasi bahwa data benar-benar masuk.
    const { data, error } = await supabaseClient
      .from("circle_records")
      .insert(payload)
      .select("id")
      .single();

    if (error) throw error;
    if (!data?.id) {
      throw new Error("Supabase belum mengonfirmasi data tersimpan.");
    }

    // Refresh berjalan di latar belakang, tidak menghambat status berhasil.
    refreshRows().catch((err) => {
      console.error("Refresh setelah create gagal:", err);
    });

    return { isOk: true };
  } catch (error) {
    console.error("Supabase create failed:", error);
    return {
      isOk: false,
      error: error.message || "Gagal menyimpan data."
    };
  }

async function enablePushNotifications() {
  try {
    if (!("serviceWorker" in navigator) ||
        !("PushManager" in window) ||
        !("Notification" in window)) {
      throw new Error("Browser ini belum mendukung push notification.");
    }

    if (!VAPID_PUBLIC_KEY ||
        VAPID_PUBLIC_KEY === "TEMPEL_PUBLIC_KEY_ASLI_DI_SINI") {
      throw new Error("Public Key VAPID belum diisi.");
    }

    const { data: { session }, error: sessionError } =
      await supabaseClient.auth.getSession();

    if (sessionError) throw sessionError;
    if (!session) {
      throw new Error("Silakan login terlebih dahulu.");
    }

    const permission = await Notification.requestPermission();

    if (permission !== "granted") {
      throw new Error("Izin notifikasi belum diberikan.");
    }

    const registration = await navigator.serviceWorker.ready;

    function urlBase64ToUint8Array(base64String) {
      const padding = "=".repeat((4 - base64String.length % 4) % 4);
      const base64 = (base64String + padding)
        .replace(/-/g, "+")
        .replace(/_/g, "/");
      const raw = atob(base64);
      return Uint8Array.from(raw, char => char.charCodeAt(0));
    }

    let subscription = await registration.pushManager.getSubscription();

    if (!subscription) {
      subscription = await registration.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
      });
    }

    const subscriptionJson = subscription.toJSON();

    
const { data: existing, error: lookupError } = await supabaseClient
  .from("push_subscriptions")
  .select("user_id")
  .eq("endpoint", subscription.endpoint)
  .maybeSingle();

if (lookupError) throw lookupError;

if (existing && existing.user_id !== session.user.id) {
  throw new Error(
    "Langganan browser ini sudah terhubung ke akun lain. " +
    "Silakan hubungi admin sebelum memindahkannya."
  );
}

const { error: saveError } = await supabaseClient
  .from("push_subscriptions")
  .upsert({
    user_id: session.user.id,
    endpoint: subscription.endpoint,
    subscription: subscriptionJson,
    updated_at: new Date().toISOString()
  }, {
    onConflict: "endpoint"
  });
    if (saveError) throw saveError;

    notify("Notifikasi berhasil diaktifkan untuk browser ini.");
  } catch (error) {
    console.error("Aktivasi push gagal:", error);
    notify(error.message || "Gagal mengaktifkan notifikasi.", true);
  }
}
